name: CI

on:
  push:
  pull_request:

jobs:
  core:
    name: Core (no AstrBot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -S scripts/run_tests.py core

  host-min-release:
    name: Host minimum and release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff 钉在 <0.16：~= 对两位版本号会放开主版本位，0.16 起默认规则集变大（I001/SIM102/PIE790 等）。
      - run: python -m pip install "astrbot==4.23.3" "ruff>=0.15,<0.16"
      - run: python scripts/build_release.py

  host-latest:
    name: Host latest 4.x
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "astrbot>=4.23,<5"
      - run: python scripts/run_tests.py host
